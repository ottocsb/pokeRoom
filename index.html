<!doctype html>
<html lang="zh-CN" data-theme="classic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>德州扑克 · 主题牌桌</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">♠</span>
          <span class="title">德州扑克</span>
          <span class="meta" id="meta"></span>
        </div>
        <nav class="top-actions">
          <button class="tbtn invite" id="btn-share" title="邀请好友：复制带邀请码的房间链接" hidden><span class="ico">✉</span><span class="lbl">邀请</span></button>
          <button class="tbtn" id="btn-stand" title="起身离座（旁观）" hidden><span class="ico">⇣</span><span class="lbl">起身</span></button>
          <button class="tbtn" id="btn-bot" title="在空座添加一名电脑玩家" hidden><span class="ico">+</span><span class="lbl">电脑</span></button>
          <button class="tbtn" id="btn-unbot" title="本手结束后移除所有电脑玩家" hidden><span class="ico">−</span><span class="lbl">电脑</span></button>
          <button class="tbtn" id="btn-room" title="单机牌桌设置 / 离开房间"><span class="ico">⌂</span><span class="lbl">牌桌</span></button>
          <button class="tbtn unit" id="btn-unit" title="切换分数 / BB 显示"><span class="ico">⇄</span><span class="lbl-fixed" id="unit-lbl">分</span></button>
          <button class="tbtn" id="btn-ladder" title="牌型表"><span class="ico">▤</span><span class="lbl">牌型</span></button>
          <button class="tbtn" id="btn-theme" title="更换牌桌主题"><span class="ico">◐</span><span class="lbl">主题</span></button>
          <button class="tbtn" id="btn-sound" title="音效"><span class="ico" id="sound-ico">♪</span></button>
          <button class="tbtn" id="btn-new" title="重新开始"><span class="ico">↻</span><span class="lbl">重开</span></button>
        </nav>
      </header>

      <main class="stage">
        <aside class="ladder" id="ladder" aria-label="牌型表"></aside>
        <div class="table-wrap" id="table-wrap">
          <div class="table" id="table">
            <div class="rail"></div>
            <div class="felt"><div class="emblem"></div></div>
            <div class="pot" id="pot"></div>
            <div class="board" id="board"></div>
            <div class="msg" id="msg"></div>
            <div id="seats"></div>
          </div>
        </div>
      </main>

      <section class="hero" id="hero">
        <div class="hero-hand">
          <div class="hole" id="hole"></div>
          <div class="badge" id="badge">
            <div class="badge-head"><span class="badge-label">当前牌型</span><span class="badge-stack" id="badge-stack" title="你的筹码（另一种单位）"></span></div>
            <strong class="badge-name" id="badge-name">—</strong>
            <span class="badge-sub" id="badge-sub"></span>
            <div class="badge-meter" id="badge-meter"></div>
          </div>
        </div>
        <div class="controls">
          <div class="raise-panel" id="raise-panel" hidden>
            <div class="raise-presets">
              <button data-preset="min">最小</button>
              <button data-preset="half">½ 池</button>
              <button data-preset="pot">底池</button>
              <button data-preset="max">全下</button>
            </div>
            <div class="raise-info" id="raise-info"></div>
            <div class="raise-row">
              <input type="range" id="raise-range" min="0" max="100" step="10" />
              <output id="raise-out">0</output>
            </div>
          </div>
          <div class="actions" id="actions">
            <button class="act fold" id="act-fold">弃牌<kbd>F</kbd></button>
            <button class="act call" id="act-call">过牌<kbd>C</kbd></button>
            <button class="act raise" id="act-raise">加注<kbd>R</kbd></button>
            <button class="act allin" id="act-allin">全下<kbd>A</kbd></button>
            <button class="act next" id="act-next" hidden><span>下一手 ▶</span><kbd>空格</kbd></button>
          </div>
          <div class="status" id="status"></div>
        </div>
      </section>

      <div class="popover" id="theme-pop" hidden></div>
      <div class="net-banner" id="net-banner" hidden></div>
      <div class="toast" id="toast" role="status" hidden></div>
      <div class="overlay" id="overlay" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
